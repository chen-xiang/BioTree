openapi: 3.0.3
info:
  title: BioTree API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
  /api/taxa/children:
    get:
      operationId: listChildren
      parameters:
        - in: query
          name: parentId
          schema: { type: integer, format: int64 }
        - in: query
          name: locale
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        '200':
          description: OK
  /api/taxa/search:
    get:
      operationId: searchTaxa
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: locale
          schema: { type: string }
      responses:
        '200':
          description: OK
  /api/taxa/{id}:
    get:
      operationId: getTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: locale
          schema: { type: string }
      responses:
        '200':
          description: OK
  /api/admin/taxa/{id}/move:
    post:
      operationId: moveTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newParentId]
              properties:
                newParentId: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
