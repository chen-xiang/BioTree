openapi: 3.0.3
info:
  title: BioTree API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /api/stats/summary:
    get:
      operationId: getStatsSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStatsSummary'
  /api/taxa/children:
    get:
      operationId: listChildren
      parameters:
        - in: query
          name: parentId
          schema: { type: integer, format: int64 }
        - in: query
          name: locale
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
        - in: query
          name: view
          schema: { type: string, enum: [simple, full], default: simple }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageTaxonListItem'
  /api/taxa/search:
    get:
      operationId: searchTaxa
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: locale
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageTaxonListItem'
  /api/taxa/{id}:
    get:
      operationId: getTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: locale
          schema: { type: string }
        - in: query
          name: view
          schema: { type: string, enum: [simple, full], default: simple }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonDetail'
  /api/taxa/{id}/media:
    get:
      operationId: listTaxonMedia
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageTaxonMedia'
  /api/admin/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUsername'
  /api/admin/auth/me:
    get:
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUsername'
  /api/admin/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/admin/import/status:
    get:
      operationId: getImportStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseImportStatus'
  /api/admin/taxa:
    post:
      operationId: createTaxon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonDetail'
  /api/admin/taxa/{id}:
    put:
      operationId: updateTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonDetail'
    delete:
      operationId: deleteTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/admin/taxa/{id}/move:
    post:
      operationId: moveTaxon
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: locale
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newParentId]
              properties:
                newParentId: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonDetail'
  /api/admin/taxa/{taxonId}/media:
    post:
      operationId: uploadTaxonMedia
      parameters:
        - in: path
          name: taxonId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                locale: { type: string }
                caption: { type: string }
                license: { type: string }
                attribution: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonMedia'
  /api/admin/taxa/{taxonId}/media/{mediaId}:
    put:
      operationId: updateTaxonMedia
      parameters:
        - in: path
          name: taxonId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: mediaId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: string, nullable: true }
                sortOrder: { type: integer, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaxonMedia'
    delete:
      operationId: deleteTaxonMedia
      parameters:
        - in: path
          name: taxonId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: mediaId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  schemas:
    TaxonRank:
      type: string
      enum:
        - KINGDOM
        - SUBKINGDOM
        - PHYLUM
        - SUBPHYLUM
        - CLASS
        - SUBCLASS
        - ORDER
        - SUBORDER
        - SUPERFAMILY
        - FAMILY
        - SUBFAMILY
        - TRIBE
        - GENUS
        - SUBGENUS
        - SPECIES
        - SUBSPECIES
        - VARIETY
        - FORM
        - OTHER
    TaxonListItem:
      type: object
      required: [id, rank, scientificName, childCount, hasChildren, directChildCount]
      properties:
        id: { type: integer, format: int64 }
        rank: { $ref: '#/components/schemas/TaxonRank' }
        scientificName: { type: string }
        commonName: { type: string, nullable: true }
        childCount: { type: integer, description: Visible children for current view }
        hasChildren: { type: boolean }
        rankRaw: { type: string, nullable: true }
        directChildCount: { type: integer, description: Physical direct child count }
        placeholder: { type: boolean, description: Simple-view unclassified bucket }
    TaxonBreadcrumb:
      type: object
      required: [id, rank, scientificName]
      properties:
        id: { type: integer, format: int64 }
        rank: { $ref: '#/components/schemas/TaxonRank' }
        scientificName: { type: string }
        commonName: { type: string, nullable: true }
    TaxonMedia:
      type: object
      required: [id, url]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        mimeType: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        sortOrder: { type: integer }
        locale: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        license: { type: string, nullable: true }
        attribution: { type: string, nullable: true }
    TaxonSynonym:
      type: object
      required: [id, scientificName]
      properties:
        id: { type: integer, format: int64 }
        scientificName: { type: string }
    TaxonDetail:
      type: object
      required: [id, rank, scientificName, locale, childCount, accepted, breadcrumbs, media, mediaTotal, synonyms, vernaculars, distributions, directChildCount]
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64, nullable: true }
        rank: { $ref: '#/components/schemas/TaxonRank' }
        scientificName: { type: string }
        scientificNameAuthorship: { type: string, nullable: true }
        scientificNameVerbatim: { type: string, nullable: true }
        namePublishedIn: { type: string, nullable: true }
        nameAccordingTo: { type: string, nullable: true }
        nomenclaturalCode: { type: string, nullable: true }
        nomenclaturalStatus: { type: string, nullable: true }
        commonName: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        locale: { type: string }
        childCount: { type: integer, description: Visible children for current view }
        accepted: { type: boolean }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/TaxonBreadcrumb' }
        media:
          type: array
          items: { $ref: '#/components/schemas/TaxonMedia' }
        mediaTotal: { type: integer, format: int64 }
        synonyms:
          type: array
          items: { $ref: '#/components/schemas/TaxonSynonym' }
        rankRaw: { type: string, nullable: true }
        vernaculars:
          type: array
          items: { $ref: '#/components/schemas/TaxonVernacular' }
        distributions:
          type: array
          items: { $ref: '#/components/schemas/TaxonDistribution' }
        directChildCount: { type: integer }
        nearestSimpleAncestorId: { type: integer, format: int64, nullable: true }
        placeholder: { type: boolean, description: Simple-view unclassified bucket }
    TaxonVernacular:
      type: object
      required: [locale, commonName, preferred]
      properties:
        locale: { type: string }
        commonName: { type: string }
        preferred: { type: boolean }
    TaxonDistribution:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        countryCode: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        establishmentMeans: { type: string, nullable: true }
        threatStatus: { type: string, nullable: true }
        sourceText: { type: string, nullable: true }
    PageTaxonListItem:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaxonListItem' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    PageTaxonMedia:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaxonMedia' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    StatsSummary:
      type: object
      required: [totalTaxa, byRank, byKingdom]
      properties:
        totalTaxa: { type: integer, format: int64 }
        byRank:
          type: object
          additionalProperties: { type: integer, format: int64 }
        byKingdom:
          type: object
          additionalProperties: { type: integer, format: int64 }
        dataset:
          $ref: '#/components/schemas/DatasetCitation'
          nullable: true
    DatasetCitation:
      type: object
      properties:
        title: { type: string, nullable: true }
        version: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        importedAt: { type: string, format: date-time, nullable: true }
    CreateTaxonRequest:
      type: object
      required: [rank, scientificName]
      properties:
        parentId: { type: integer, format: int64, nullable: true }
        rank: { $ref: '#/components/schemas/TaxonRank' }
        scientificName: { type: string }
        locale: { type: string }
        commonName: { type: string }
        summary: { type: string }
        description: { type: string }
    UpdateTaxonRequest:
      type: object
      required: [scientificName]
      properties:
        scientificName: { type: string }
        accepted: { type: boolean }
        locale: { type: string }
        commonName: { type: string }
        summary: { type: string }
        description: { type: string }
    ApiResponseHealth:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            status: { type: string }
    ApiResponseStatsSummary:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/StatsSummary' }
    ApiResponsePageTaxonListItem:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/PageTaxonListItem' }
    ApiResponsePageTaxonMedia:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/PageTaxonMedia' }
    ApiResponseTaxonDetail:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/TaxonDetail' }
    ApiResponseTaxonMedia:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/TaxonMedia' }
    ApiResponseUsername:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            username: { type: string }
    ApiResponseVoid:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
    ImportStatus:
      type: object
      properties:
        jobKey: { type: string }
        phase: { type: string }
        processedCount: { type: integer, format: int64 }
        totalHint: { type: integer, format: int64 }
        detail: { type: string }
        running: { type: boolean }
    ApiResponseImportStatus:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/ImportStatus' }
