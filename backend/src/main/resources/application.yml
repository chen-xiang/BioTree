spring:
  application:
    name: biotree
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/biotree?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
    username: biotree
    password: biotree
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
    session:
      timeout: 8h
      cookie:
        name: BIOTREESESSION
        http-only: true
        same-site: lax
        # 生产环境 HTTPS 下改为 true
        secure: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173
  storage:
    type: local
    local:
      base-path: ./data/files
      public-base-url: /files
    oss:
      endpoint:
      bucket:
      access-key:
      secret-key:
      public-base-url:
  import:
    enabled: false
    dwca-path: ../data/import/col_latest_dwca.zip
    replace: false
    kingdoms:
      - Animalia
      - Plantae
    max-per-rank: 0
    import-vernaculars: true

logging:
  level:
    root: INFO
    com.chenxiang.biotree: INFO
